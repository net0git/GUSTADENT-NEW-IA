@if (visible()) {
  <nav class="paginador" aria-label="Paginación de la tabla">
    <span class="paginador-info">
      Mostrando {{ desde() }}–{{ hasta() }} de {{ total() }} {{ sustantivo() }}
    </span>

    <div class="paginador-acciones">
      <label class="paginador-tamano">
        <select
          class="tamano-select"
          (change)="cambiarTamano($any($event.target).value)"
          aria-label="Filas por página"
        >
          @for (opcion of tamanos; track opcion) {
            <option [value]="opcion" [selected]="opcion === tamano()">{{ opcion }}</option>
          }
        </select>
        <span class="tamano-texto">por página</span>
      </label>

      @if (totalPaginas() > 1) {
        <ul class="paginador-controles">
          <li>
            <button
              type="button"
              class="pagina-btn"
              [disabled]="pagina() === 1"
              (click)="irAPagina(pagina() - 1)"
              aria-label="Página anterior"
            >
              <i class="bi bi-chevron-left"></i>
            </button>
          </li>

          @for (marca of marcas(); track $index) {
            <li>
              @if (marca === 'puntos') {
                <span class="pagina-puntos">…</span>
              } @else {
                <button
                  type="button"
                  class="pagina-btn"
                  [class.activa]="marca === pagina()"
                  [attr.aria-current]="marca === pagina() ? 'page' : null"
                  (click)="irAPagina(marca)"
                >
                  {{ marca }}
                </button>
              }
            </li>
          }

          <li>
            <button
              type="button"
              class="pagina-btn"
              [disabled]="pagina() === totalPaginas()"
              (click)="irAPagina(pagina() + 1)"
              aria-label="Página siguiente"
            >
              <i class="bi bi-chevron-right"></i>
            </button>
          </li>
        </ul>
      }
    </div>
  </nav>
}
