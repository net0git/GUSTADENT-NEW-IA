<div class="calendario">
  <div class="calendario-cabecera">
    <span class="calendario-titulo">{{ tituloMes() }}</span>
    <div class="calendario-navegacion">
      <button type="button" class="btn-navegacion" aria-label="Mes anterior" (click)="mesAnterior()">
        <i class="bi bi-chevron-left"></i>
      </button>
      <button type="button" class="btn-navegacion" aria-label="Mes siguiente" (click)="mesSiguiente()">
        <i class="bi bi-chevron-right"></i>
      </button>
    </div>
  </div>

  <div class="calendario-rejilla">
    @for (nombre of nombresDias; track $index) {
      <span class="dia-nombre">{{ nombre }}</span>
    }

    @for (dia of dias(); track dia.fecha.getTime()) {
      <button
        type="button"
        class="dia"
        [class.dia-fuera-mes]="!dia.esDelMes"
        [class.dia-hoy]="dia.esHoy"
        [class.dia-seleccionado]="dia.esSeleccionado"
        [class.dia-con-citas]="dia.citas > 0"
        [attr.title]="dia.citas > 0 ? dia.citas + (dia.citas === 1 ? ' cita pendiente' : ' citas pendientes') : null"
        (click)="seleccionar(dia)"
      >
        {{ dia.numero }}
      </button>
    }
  </div>
</div>
