<div class="login-pagina">
  <div class="login-tarjeta">
    <header class="login-cabecera">
      <span class="marca-icono"><i class="bi bi-grid-3x3-gap-fill"></i></span>
      <h1 class="titulo">GUSTADENT</h1>
      <p class="subtitulo">Inicia sesión para continuar</p>
    </header>

    <form [formGroup]="formulario" (ngSubmit)="iniciarSesion()" novalidate>
      <div class="mb-3">
        <label for="username" class="form-label">Usuario <span class="obligatorio">*</span></label>
        <input
          id="username"
          class="form-control"
          autocomplete="username"
          formControlName="username"
          [class.is-invalid]="formulario.controls.username.invalid && formulario.controls.username.touched"
        />
        <div class="invalid-feedback">Ingresa tu usuario</div>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label">Contraseña <span class="obligatorio">*</span></label>
        <input
          id="password"
          type="password"
          class="form-control"
          autocomplete="current-password"
          formControlName="password"
          [class.is-invalid]="formulario.controls.password.invalid && formulario.controls.password.touched"
        />
        <div class="invalid-feedback">Ingresa tu contraseña</div>
      </div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="cargando()">
        @if (cargando()) {
          <span class="spinner-border spinner-border-sm me-2" role="status"></span>
        }
        Iniciar sesión
      </button>
    </form>
  </div>
</div>
